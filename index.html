<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umang Rajput — Digital Marketing Specialist</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card: #121216;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #22d3ee;
      --accent2: #818cf8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 50%, rgba(129, 140, 248, 0.08), transparent),
        var(--bg);
    }

    .hero-badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(34, 211, 238, 0.1);
      border: 1px solid rgba(34, 211, 238, 0.3);
      border-radius: 100px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #a5f3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 1.25rem;
      color: var(--muted);
      max-width: 560px;
      margin-bottom: 36px;
    }

    .hero-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: 0.25s;
    }

    .btn-primary {
      background: var(--accent);
      color: #09090b;
    }
    .btn-primary:hover {
      background: #67e8f9;
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }
    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Sections */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px 100px;
    }

    section {
      margin-top: 100px;
    }

    .section-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }

    h2 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 32px;
    }

    /* About */
    .about-text {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 640px;
      line-height: 1.8;
    }

    /* Case Studies */
    .case {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      transition: 0.3s;
    }

    .case::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--accent), var(--accent2));
    }

    .case:hover {
      border-color: #3f3f46;
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -20px rgba(0,0,0,0.5);
    }

    .case-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .case h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .case-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .case-role {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent);
    }

    .case ul {
      margin-left: 18px;
      color: #d4d4d8;
    }

    .case li {
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    /* Skills */
    .skills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill {
      padding: 10px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #e4e4e7;
      transition: 0.2s;
    }

    .skill:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(34, 211, 238, 0.05);
    }

    /* Contact */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .contact-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .contact-item span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .contact-item a, .contact-item p {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    .contact-item a:hover {
      color: var(--accent);
    }

      text-align: center;
      padding: 40px 20px;
      color: #52525b;
      font-size: 0.9rem;
      border-top: 1
